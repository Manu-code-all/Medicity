# Datasource properties are supplied by AbstractIntegrationTest from the
# Testcontainers instance, so nothing is hard-coded here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

medicity:
  jwt:
    secret: test-only-secret-value-that-is-long-enough-for-hs256
    access-ttl: PT15M
    refresh-ttl: P7D

  auth:
    # Every test reaches the API from one address and registers many accounts
    # (and fails many logins), so the per-address limits are effectively off.
    # AddressThrottleTest sets small ones of its own.
    address-login-throttle:
      max-failures: 1000000
    signup-throttle:
      max-attempts: 1000000

logging:
  level:
    com.medicity: DEBUG
    org.testcontainers: WARN
