# Adds the seed location on top of the real migrations. Activated with
# SPRING_PROFILES_ACTIVE=demo; without it, db/seed is never on the Flyway path.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.medicity: DEBUG

# The demo accounts' phone numbers are public, so their sign-in codes are
# shown on screen instead of texted. Real numbers never see this.
medicity:
  auth:
    otp:
      show-demo-codes: true
  # The demo's video visit is today at a fixed time; a wide window lets a
  # visitor try it at any hour. Real visits open 15 minutes before.
  video:
    join-before: PT14H
    join-after: PT14H
