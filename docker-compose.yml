services:
  db:
    image: postgres:18-alpine   # same major version as production
    environment:
      POSTGRES_DB: medicity
      POSTGRES_USER: medicity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medicity}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker and
      # refuse to start with a volume at the old /var/lib/postgresql/data path.
      # A volume created by the old 16 image will not open on 18: remove it
      # with `docker compose down -v` (this deletes local data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # The API waits for this rather than sleeping, so a slow first-run
      # database initialisation cannot race the application start.
      test: ["CMD-SHELL", "pg_isready -U medicity -d medicity"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/medicity
      DB_USER: medicity
      DB_PASSWORD: ${DB_PASSWORD:-medicity}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32bytes-min}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  pgdata:
